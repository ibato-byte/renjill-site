<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4EAD8">
<title>ページが見つかりません｜レンとジル</title>
<link rel="icon" href="https://hay-dash.coana.co.jp/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
:root { --cream: #F4EAD8; --paper: #FBF6EC; --ink: #2B1D12; --ink-2: #5A4433; --navy: #1E3A5F; --navy-d: #142A47; --mustard: #D9A520; --brown: #5C3A1E; --edge: #E3D2B8; --fur: #C99A67; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; background: var(--cream); color: var(--ink); font: 700 16px/1.8 "Zen Maru Gothic", "Fredoka", sans-serif; text-align: center; }
body.en { font-family: "Fredoka", "Zen Maru Gothic", sans-serif; font-weight: 600; }
main { width: min(100%, 460px); padding: 34px 26px 30px; border: 4px solid #fff; border-radius: 30px; background: var(--paper); box-shadow: 0 24px 44px -20px rgba(60, 36, 14, .5); }
svg { display: block; width: 120px; height: 120px; margin: 0 auto 6px; }
.no { margin: 0; font: 700 72px/1 "Fredoka", sans-serif; letter-spacing: -.03em; color: var(--paper); -webkit-text-stroke: 3px var(--brown); paint-order: stroke fill; text-shadow: 5px 5px 0 var(--brown); }
h1 { margin: 14px 0 4px; font-size: 22px; line-height: 1.4; }
p { margin: 0 0 22px; color: var(--ink-2); font-size: 15px; }
.go { display: grid; gap: 12px; }
a.btn { display: flex; align-items: center; justify-content: center; min-height: 56px; padding: 0 22px; border-radius: 18px; background: var(--navy); color: #fff; text-decoration: none; box-shadow: 0 6px 0 var(--navy-d); }
a.btn.lite { background: #fff; color: var(--ink); box-shadow: 0 6px 0 var(--edge); }
a.btn:hover { transform: translateY(2px); box-shadow: 0 4px 0 var(--navy-d); }
a.btn.lite:hover { box-shadow: 0 4px 0 var(--edge); }
a:focus-visible { outline: 3px solid var(--mustard); outline-offset: 3px; }
.sns { margin-top: 22px; padding-top: 18px; border-top: 3px dotted var(--fur); }
.sns p { margin: 0 0 10px; font-size: 13px; }
.sns div { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.sns a { display: inline-flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 12px; background: var(--cream); color: var(--ink); font: 600 13px/1 "Fredoka", sans-serif; text-decoration: none; }
.sns a:hover { background: var(--mustard); }
.langs { margin-top: 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 6px; font-size: 13px; }
.langs button { min-height: 36px; padding: 0 10px; border: 0; border-radius: 10px; background: none; color: var(--ink-2); font: inherit; cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--mustard); color: var(--ink); }
.langs button:focus-visible { outline: 3px solid var(--mustard); }
.ear { transform-origin: 50% 100%; animation: wig 1.6s ease-in-out infinite; }
.ear.r { animation-delay: .2s; }
@keyframes wig { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
@media (prefers-reduced-motion: reduce) { .ear { animation: none; } }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 120 120" aria-hidden="true">
    <g class="ear"><path d="M40 70 C 24 40, 30 10, 44 8 C 56 6, 58 40, 54 70 Z" fill="#C99A67" stroke="#2B1D12" stroke-width="4" stroke-linejoin="round"/><path d="M43 62 C 34 40, 38 20, 45 18 C 50 18, 50 44, 49 62 Z" fill="#E8A4A0"/></g>
    <g class="ear r"><path d="M80 70 C 96 40, 90 10, 76 8 C 64 6, 62 40, 66 70 Z" fill="#C99A67" stroke="#2B1D12" stroke-width="4" stroke-linejoin="round"/><path d="M77 62 C 86 40, 82 20, 75 18 C 70 18, 70 44, 71 62 Z" fill="#E8A4A0"/></g>
    <circle cx="60" cy="80" r="34" fill="#C99A67" stroke="#2B1D12" stroke-width="4"/>
    <g fill="none" stroke="#8C5A37" stroke-width="3"><circle cx="47" cy="78" r="9"/><circle cx="73" cy="78" r="9"/><path d="M56 78h8"/></g>
    <circle cx="47" cy="78" r="4" fill="#2B1D12"/><circle cx="73" cy="78" r="4" fill="#2B1D12"/>
    <path d="M56 90 h8 l-4 5 Z" fill="#E8A4A0"/><path d="M54 101 c4 -3 8 -3 12 0" fill="none" stroke="#2B1D12" stroke-width="3" stroke-linecap="round"/>
  </svg>
  <p class="no">404</p>
  <h1 id="h">ページが見つかりません</h1>
  <p id="m">課長が書類の山を崩してしまったようです。<br>このページは見つかりませんでした。</p>
  <div class="go">
    <a class="btn" id="home" href="/">トップへ戻る</a>
    <a class="btn lite" id="game" href="https://hay-dash.coana.co.jp/">ゲームで遊ぶ</a>
  </div>
  <nav class="sns" aria-label="SNS">
    <p id="f">新作は月・水・金・日。フォローしてね。</p>
    <div>
      <a href="https://www.youtube.com/@renjill_office?sub_confirmation=1" target="_blank" rel="noopener">YouTube</a>
      <a href="https://www.instagram.com/renjill_office/" target="_blank" rel="noopener">Instagram</a>
      <a href="https://www.tiktok.com/@renjill_office" target="_blank" rel="noopener">TikTok</a>
      <a href="https://www.threads.net/@renjill_office" target="_blank" rel="noopener">Threads</a>
      <a href="https://www.facebook.com/1358515160686321" target="_blank" rel="noopener">Facebook</a>
    </div>
  </nav>
  <div class="langs" role="group" aria-label="Language">
    <button type="button" data-l="ja" lang="ja">日本語</button>
    <button type="button" data-l="en" lang="en">English</button>
    <button type="button" data-l="zh" lang="zh-Hant">繁體中文</button>
    <button type="button" data-l="ko" lang="ko">한국어</button>
  </div>
</main>
<script>
(() => {
  const L = {
    ja: { tag: "ja", title: "ページが見つかりません｜レンとジル", h: "ページが見つかりません", m: "課長が書類の山を崩してしまったようです。<br>このページは見つかりませんでした。", home: "トップへ戻る", game: "ゲームで遊ぶ", f: "新作は月・水・金・日。フォローしてね。" },
    en: { tag: "en", title: "Page not found | Ren & Jill", h: "Page not found", m: "Looks like the boss knocked over the paper pile.<br>We couldn't find this page.", home: "Back to the top page", game: "Play the game", f: "New episodes Mon, Wed, Fri and Sun. Follow along!" },
    zh: { tag: "zh-Hant", title: "找不到頁面｜Ren & Jill", h: "找不到頁面", m: "好像是課長把文件山弄倒了。<br>找不到這個頁面。", home: "回到首頁", game: "玩遊戲", f: "新片在一、三、五、日。歡迎追蹤！" },
    ko: { tag: "ko", title: "페이지를 찾을 수 없어요 | Ren & Jill", h: "페이지를 찾을 수 없어요", m: "과장님이 서류 산을 무너뜨린 것 같아요.<br>이 페이지를 찾지 못했습니다.", home: "처음 페이지로", game: "게임하기", f: "신작은 월·수·금·일. 팔로우해 주세요!" }
  };
  const $ = (id) => document.getElementById(id);
  const set = (l) => {
    const x = L[l] || L.ja;
    document.documentElement.lang = x.tag; document.title = x.title; document.body.classList.toggle("en", l === "en");
    $("h").textContent = x.h; $("m").innerHTML = x.m; $("home").textContent = x.home; $("game").textContent = x.game; $("f").textContent = x.f;
    $("home").href = "/?lang=" + l;
    document.querySelectorAll(".langs button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.l === l));
  };
  let l = null; try { l = localStorage.getItem("rj-lang"); } catch (e) {}
  if (!L[l]) { const n = (navigator.language || "").toLowerCase(); l = n.startsWith("ja") ? "ja" : n.startsWith("zh") ? "zh" : n.startsWith("ko") ? "ko" : "en"; }
  set(l);
  document.querySelectorAll(".langs button").forEach((b) => b.addEventListener("click", () => { set(b.dataset.l); try { localStorage.setItem("rj-lang", b.dataset.l); } catch (e) {} }));
})();
</script>
</body>
</html>
